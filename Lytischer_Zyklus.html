<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf6">

<title>Lytischer Zyklus – Animation</title>
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#28392e;background:#fafaf6;--ink:#28392e;--muted:#6c796f;--line:#dce3d8;--green:#507644;--panel:#fffefa}

.scene{position:relative;flex:1;min-height:245px;margin:0 -12px}#animation{display:block;width:100%;height:100%;position:absolute;inset:0}.scene-badge{position:absolute;top:14px;left:10px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#7f8a7e;pointer-events:none}.caption-block{flex:none;text-align:center;min-height:76px;padding:3px 0 9px}.phase-heading{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:7px}.key-badge{font-size:11px;white-space:nowrap;color:#50624f;background:#eaf0e2;border-radius:6px;padding:5px 7px;font-variant-numeric:tabular-nums}#phase-title{font-size:16px;font-weight:600;letter-spacing:-.2px}#caption{max-width:950px;margin:0 auto;font-size:15px;line-height:1.45;color:#59695d}.counts{height:18px;line-height:18px;margin-top:4px;font-size:11px;color:#798577;font-variant-numeric:tabular-nums}.counts:empty{display:none}
.keyframes{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;flex:none;margin:0 0 12px}.keyframe{min-width:0;border:1px solid transparent;border-radius:10px;padding:5px 2px 7px;background:#f0f3ea;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}.keyframe:hover{background:#e7eedf}.keyframe[aria-current=step]{background:#e2ebd7;border-color:#a0b987}.keyframe canvas{width:100%;height:37px;object-fit:contain;display:block;pointer-events:none}.keyframe .num{font-size:11px;font-weight:600;color:#61725b}.keyframe .name{font-size:10px;color:#697663;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.keyframe[aria-current=step] .num,.keyframe[aria-current=step] .name{color:#2c4a25}.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 24px;color:#68766b;font-size:11px;margin:0 0 14px;min-height:16px}.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.legend i{width:19px;height:3px;border-radius:4px;display:inline-block;background:var(--color)}.legend .dot{width:8px;height:8px;border-radius:3px}.legend[hidden]{display:flex;visibility:hidden}
.player{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;display:flex;align-items:center;gap:9px;flex:none}.play{height:44px;min-width:100px;background:var(--ink);color:#fffefa;border:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:14px}.play:hover{background:#40563e}.play svg{width:17px;height:17px}.scrub{flex:1;min-width:90px;display:flex;align-items:center;gap:12px;padding:0 6px}.scrub input{width:100%;height:30px;margin:0;accent-color:var(--green);cursor:ew-resize;touch-action:pan-y}.time{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}.speed{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}select{height:40px;border:1px solid var(--line);border-radius:9px;padding:4px 5px 4px 8px;background:transparent;color:var(--ink)}footer{display:flex;justify-content:space-between;gap:16px;font-size:10px;color:#879181;margin-top:9px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.app:fullscreen{background:#fafaf6;max-width:none;max-height:none;height:100vh;padding:22px 4vw}
dialog{border:1px solid var(--line);border-radius:18px;background:#fffefa;color:var(--ink);width:min(660px,92vw);max-height:90dvh;padding:0;box-shadow:0 20px 80px #23351e25}dialog::backdrop{background:#25322770}.dialog-header{position:sticky;top:0;z-index:1;background:#fffefa;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}.dialog-header strong{font-size:16px}.dialog-copy{padding:12px 20px 0;margin:0;font-size:13px;color:var(--muted)}dialog img{display:block;background:white;width:100%;height:auto;margin-top:12px;padding:18px}noscript{display:block;padding:30px}
@media(max-width:1000px){.app{padding:20px 22px 14px}.tools{gap:7px}.keyframes{gap:4px}.keyframe .name{font-size:9px}.speed>span{display:none}.player{gap:7px}.legend{gap:9px 16px}.caption-block{min-height:80px}#caption{font-size:14px}}
@media(max-width:700px){.app{padding:17px 14px;min-height:700px;height:auto;min-height:100dvh}.tools{gap:5px}.tools .toggle{font-size:0;gap:0}.tools .toggle input{margin:8px}.tools .text-button{font-size:0;padding:0;width:40px}.tools .text-button .icon{width:18px}.tools #fullscreen{display:none}h1{font-size:27px}.subtitle{font-size:12px}.scene{flex:none;height:310px;min-height:0;margin:7px -12px 0}.caption-block{min-height:105px}.scene-badge{font-size:9px;top:4px}.keyframes{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:0 0 5px;gap:5px;margin-bottom:10px}.keyframe{min-width:67px;scroll-snap-align:center}.keyframe .name{font-size:9px}.keyframe canvas{height:31px}.legend{font-size:10px;gap:8px 13px;margin-bottom:14px}.player{flex-wrap:wrap;padding:10px}.scrub{order:3;flex-basis:100%;padding:0}.play{flex:1}.speed{margin-left:auto}.prev-next{display:none}footer .keyboard-hint{display:none}.counts{font-size:10px}#caption{font-size:14px}.phase-heading{margin-bottom:6px}}
@media(max-height:700px) and (min-width:701px){.app{min-height:560px;padding-top:14px;padding-bottom:12px}h1{font-size:28px}.subtitle{font-size:12px}.scene{min-height:200px}.caption-block{min-height:70px;padding-bottom:6px}.keyframe canvas{height:27px}.keyframes{margin-bottom:8px}.keyframe{padding:3px 2px 4px}.legend{margin-bottom:8px}.player{padding:8px 10px}footer{margin-top:6px}#caption{font-size:13px}#phase-title{font-size:14px}.counts{height:15px;line-height:15px}}

.observation{flex:none;margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.question-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}.question-toolbar label{font-weight:600;font-size:14px}.question-toolbar select{max-width:180px}.question-toolbar .question-progress{margin-left:auto;font-size:12px;color:var(--muted)}
.observation fieldset{border:0;padding:0;margin:0}.observation legend{font-weight:600;font-size:16px;margin-bottom:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}.answer:has(input:checked){background:#eaf0e2;border-color:#9db48b}.answer input{accent-color:var(--green);flex:none}.question-actions{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:42px}.question-feedback{font-size:13px}.app{height:auto;min-height:100dvh;max-height:none}.scene{flex:none;height:clamp(280px,43vh,480px)}
@media(max-width:700px){.answers{grid-template-columns:1fr}.observation{padding:12px}.question-toolbar .question-progress{margin-left:0}.scene{height:280px}.question-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="app" id="app">
  <header>
    <div><h1>Lytischer Zyklus</h1></div>
    <div class="tools">
      <label class="toggle" title="Beschriftungen anzeigen"><input id="labels" type="checkbox" checked aria-label="Beschriftungen anzeigen">Beschriftungen</label>
      <button class="icon-button" id="zoom" type="button" aria-label="Details vergrößern" aria-pressed="false" title="Details vergrößern"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7 10.5h7m-3.5-3.5v7"/></svg></button>
      <button class="icon-button" id="fullscreen" type="button" aria-label="Vollbild einschalten" title="Vollbild"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg></button>
    </div>
  </header>
  <div class="scene" id="scene">
    <canvas id="animation" role="img" aria-label="Animation des lytischen Zyklus"></canvas>
  </div>
  <div class="legend" id="legend" aria-label="Farblegende">
    <span><i style="--color:#0fd200" aria-hidden="true"></i>Erbsubstanz des Wirts</span>
    <span><i style="--color:#ff7506" aria-hidden="true"></i>Virale Erbsubstanz</span>
    <span><i class="dot" style="--color:#892ca0" aria-hidden="true"></i>Erkennungseiweiß</span>
    <span><i class="dot" style="--color:#f00000" aria-hidden="true"></i>Rezeptoren</span>
  </div>
  <div class="player" role="group" aria-label="Animation steuern">
    <button id="play" class="play" type="button"><svg id="play-icon" class="icon" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="play-text">Pause</span></button>
    <button class="icon-button" id="restart" type="button" aria-label="Von vorne abspielen" title="Von vorne"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.6 8M3 3v7h7"/></svg></button>
    <button class="icon-button prev-next" id="previous" type="button" aria-label="Voriger Abschnitt" title="Voriger Abschnitt"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m12-14-9 7 9 7Z"/></svg></button>
    <button class="icon-button prev-next" id="next" type="button" aria-label="Nächster Abschnitt" title="Nächster Abschnitt"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l9 7-9 7Z"/></svg></button>
    <div class="scrub"><label class="sr-only" for="timeline">Animationszeit</label><input id="timeline" type="range" min="0" max="80" value="0" step="0.01"><span class="time" id="time">0:00 / 1:20</span></div>
    <label class="speed"><span>Tempo</span><select id="speed" aria-label="Abspielgeschwindigkeit"><option value="0.25">0,25 ×</option><option value="0.5">0,5 ×</option><option value="1" selected>1 ×</option><option value="1.5">1,5 ×</option><option value="2">2 ×</option></select></label>
    <button class="icon-button" id="loop" type="button" aria-pressed="false" aria-label="Wiederholen" title="Wiederholen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/></svg></button>
  </div>

  <section class="observation" aria-label="Beobachtungsaufträge">
    <div class="question-toolbar"><label for="question-step">Beobachtungsauftrag</label><select id="question-step" aria-label="Schritt auswählen"></select><button class="text-button" id="watch-step" type="button">Schritt ansehen</button><button class="text-button" id="question-next" type="button">Weiter</button><span class="question-progress" id="question-progress"></span></div>
    <fieldset><legend id="question-text"></legend><div class="answers" id="answers"></div></fieldset>
    <div class="question-actions"><button class="text-button" id="check-answer" type="button" disabled>Antwort prüfen</button><span class="question-feedback" id="question-feedback" role="status" aria-live="polite"></span></div>
  </section>
</main>
<noscript>Bitte JavaScript aktivieren, um die Animation abzuspielen.</noscript>

    if(e.code==='Space'){e.preventDefault();toggle();}
    if(e.code==='ArrowRight'){e.preventDefault();seek(t+(e.shiftKey?.1:1),true);}
    if(e.code==='ArrowLeft'){e.preventDefault();seek(t-(e.shiftKey?.1:1),true);}
    if(e.code==='Home'){e.preventDefault();seek(0,true);}if(e.code==='End'){e.preventDefault();seek(80,true);}
  });
  if('ResizeObserver'in window)new ResizeObserver(resize).observe(scene);else window.addEventListener('resize',resize);
  window.LyticPlayer={seek:n=>seek(n,true),play:()=>{if(t>=80)t=0;playing=true;last=null;updatePlay();schedule();},pause:()=>{playing=false;last=null;updatePlay();},getState:()=>({time:t,playing,rate,repeat,magnified,...A.state(t)}),resize};
  updatePlay();resize();schedule();
})();
</script>
